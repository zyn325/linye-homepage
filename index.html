<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="躲避方块：一款轻量的网页小游戏。"/><title>躲避方块 · Dodge Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/>
</head>
<body><div class="page-glow" aria-hidden="true"></div><main class="game-page">
<header class="topbar"><a class="logo" href="./" aria-label="躲避方块首页"><span class="logo-mark">D</span><span>DODGE<span class="logo-dot">.</span>GAME</span></a><p class="top-note">A TINY GAME OF FOCUS</p><a class="github-link" href="https://github.com/zyn325/linye-homepage" target="_blank" rel="noreferrer">SOURCE <span>↗</span></a></header>
<section class="intro"><div><p class="eyebrow"><span class="live-dot"></span> READY WHEN YOU ARE</p><h1>躲开它们，<br/><em>活得更久。</em></h1><p class="lead">红色方块会越来越快。用左右方向键守住蓝色方块，看看你能坚持多久。</p></div><div class="best-card"><span>BEST SCORE</span><strong id="bestScore">0</strong><small>LOCAL RECORD</small></div></section>
<section class="game-shell" aria-label="躲避方块游戏"><div class="game-head"><div><span class="stat-label">SCORE</span><strong id="score">0</strong></div><div class="game-status" id="status">按空格开始游戏</div><div class="difficulty"><span class="stat-label">LEVEL</span><strong id="level">01</strong></div></div><div class="canvas-wrap"><canvas id="gameCanvas" width="600" height="700" tabindex="0" aria-label="游戏画布"></canvas><div class="screen" id="startScreen"><span class="screen-kicker">DODGE / 001</span><h2>准备好了吗？</h2><p>使用 <b>←</b> <b>→</b> 移动<br/>躲开所有红色方块</p><button class="primary-btn" id="startButton">开始游戏 <span>→</span></button></div><div class="screen hidden" id="gameOverScreen"><span class="screen-kicker">RUN COMPLETE</span><h2>游戏结束</h2><p>这次得分</p><strong class="final-score" id="finalScore">0</strong><button class="primary-btn" id="restartButton">再来一次 <span>↻</span></button></div></div><div class="controls" aria-label="触控操作"><button class="control-btn" id="leftButton" aria-label="向左移动">←</button><span>左右移动</span><button class="control-btn" id="rightButton" aria-label="向右移动">→</button></div></section>
<footer class="footer"><span>BUILT WITH CANVAS &amp; A LITTLE PATIENCE</span><span>SPACE / R TO RESTART</span></footer></main><script src="script.js"></script></body></html>
